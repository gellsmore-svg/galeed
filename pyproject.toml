[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galeed"
version = "0.2.0"
description = "Galeed — the cross-project trace/log spine: a structured event stream separating process telemetry from final output."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "gellsmore-svg"},
]
keywords = [
    "logging",
    "tracing",
    "observability",
    "event-stream",
    "telemetry",
    "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
# Intentionally dependency-free: the spine is pure stdlib so any project can adopt it.
dependencies = []

[project.urls]
Homepage = "https://github.com/gellsmore-svg/galeed"
Repository = "https://github.com/gellsmore-svg/galeed"
Issues = "https://github.com/gellsmore-svg/galeed/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
# The `galeed` debugging CLI (trace/sessions/events): pretty trees need rich,
# the store lives in the family MongoDB. `--json` output works core-only.
cli = ["rich>=13", "pymongo>=4.6"]
# `galeed serve` — the HTTP trace API browser viewers (Mizpah) read.
web = ["fastapi>=0.110", "uvicorn>=0.29", "pymongo>=4.6"]

[project.scripts]
galeed = "galeed.cli:main"
galeed-codex-hook = "galeed.hooks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
galeed = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly rather than inheriting ruff's defaults: ruff 0.16
# widened those defaults, which silently turns a green gate red on a tool
# upgrade. This is the historical default set (pyflakes + the pycodestyle
# errors worth gating), so the gate means the same thing on every ruff version.
select = ["E4", "E7", "E9", "F"]
